server:
  port: 9090
  servlet:
    context-path: /api/ragent

spring:
  application:
    name: ragent-service

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    username: root
    password: Ragent@2026!MySQL
    url: jdbc:mysql://82.156.202.167:3306/ragent?characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    hikari:
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: RagentHikariPool

  data:
    redis:
      host: 192.168.0.114
      port: 6379
      password: Ragent@2026!Redis

milvus:
  uri: http://192.168.0.114:19530

rag:
  default:
    collection-name: rag_default_store
    dimension: 1024
    metric-type: COSINE

  query-rewrite:
    enabled: true
    max-history-messages: 4
    max-history-chars: 500

  rate-limit:
    global:
      enabled: true
      max-concurrent: 1
      max-wait-seconds: 3
      lease-seconds: 30
      poll-interval-ms: 200

  memory:
    history-keep-turns: 4
    summary-start-turns: 5
    summary-enabled: true
    ttl-minutes: 60
    summary-max-chars: 200
    title-max-length: 30

  knowledge:
    schedule:
      scan-delay-ms: 10000
      lock-seconds: 900
      batch-size: 20
      min-interval-seconds: 60

  mcp:
    servers:
      - name: default
        url: http://localhost:9099

  search:
    channels:
      vector-global:
        confidence-threshold: 0.6
        top-k-multiplier: 3
      intent-directed:
        min-intent-score: 0.4
        top-k-multiplier: 2

  trace:
    enabled: true
    max-error-length: 1000

ai:
  providers:
    ollama:
      url: http://192.168.0.114:11434
      endpoints:
        chat: /api/chat
        embedding: /api/embed
    bailian:
      url: https://dashscope.aliyuncs.com
      api-key: sk-e10c10dcd8e348f78d821808932e097a
      endpoints:
        chat: /compatible-mode/v1/chat/completions
        rerank: /api/v1/services/rerank/text-rerank/text-rerank
    siliconflow:
      url: https://api.siliconflow.cn
      api-key: sk-nyjdpqajtrimudsgvgbrdmhzqoiarfmlmrciadkdjprwcpku
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    minimax:
      url: https://api.minimaxi.com/v1
      api-key: sk-cp-D85qUkSSS3x8ELErgux4k-wFKTpqZPkjIDOL5pkE7iDL2dTMpc9OXpZQVyUL_oUKguJh2n7ewpgyCZsGAt8JZzL_huvIBfsyRnzpTNlnJg8OSSBCnyESz48
      endpoints:
        chat: /chat/completions
    jina:
      url: https://api.jina.ai/v1
      api-key: jina_95ba1a0aca1048d48aebd625e7213827jBTiCyQ17or2srAtdb2_DJE3c1N7
      endpoints:
        embedding: /embeddings

  selection:
    failure-threshold: 2
    open-duration-ms: 30000

  stream:
    message-chunk-size: 1

  chat:
    default-model: minimax-m2.7
    deep-thinking-model: minimax-m2.7
    candidates:
      - id: minimax-m2.7
        provider: minimax
        model: MiniMax-M2.7
        supports-thinking: false
        priority: 1
      - id: glm-4.7
        provider: siliconflow
        model: Pro/zai-org/GLM-4.7
        supports-thinking: true
        priority: 2

  embedding:
    default-model: jina-v4
    candidates:
      - id: jina-v4
        provider: jina
        model: jina-embeddings-v4
        dimension: 1024
        priority: 1
      - id: qwen-emb-8b
        provider: siliconflow
        model: Qwen/Qwen3-Embedding-8B
        dimension: 4096
        priority: 2

  rerank:
    default-model: rerank-noop
    candidates:
      - id: rerank-noop
        provider: noop
        model: noop
        priority: 1

rustfs:
  url: http://192.168.0.114:9000
  access-key-id: rustfsadmin
  secret-access-key: rustfsadmin

sa-token:
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-log: false
  is-print: false

app:
  demo-mode: false
